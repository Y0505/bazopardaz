<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
{{canonical_tag}}<meta name="theme-color" content="#0b0b14">
<meta name="color-scheme" content="light dark">
{{social_tags}}<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script>(function(){var r=document.documentElement,t=null;try{t=localStorage.getItem('bp-theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}r.setAttribute('data-theme',t);r.className+=' js'})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="/css/style.css?v={{css_v}}">
{{page_css}}{{json_ld}}<!-- Static build trigger: regenerate generated HTML after template updates. -->
</head>
<body{{body_class}}>
{{icons}}
{{header}}
<main id="main" tabindex="-1">
{{breadcrumb}}{{content}}
</main>
{{footer}}
<script src="/js/site.js?v={{js_v}}" defer></script>
{{page_js}}</body>
</html>
